name: Build Android APK

# Builds the .NET MAUI app into an installable Android APK in the cloud.
# Runs automatically on every push to the branch, and can be started by hand.
on:
  push:
    branches:
      - claude/feature-list-review-7gaclh
      - main
  workflow_dispatch:   # adds a "Run workflow" button in the Actions tab

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'microsoft'
          java-version: '17'

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Install MAUI Android workload
        run: dotnet workload install maui-android

      - name: Restore dependencies
        run: dotnet restore HardwareShopMaui/HardwareShopMaui.csproj

      # Debug build is auto-signed with a debug key, so the APK installs for testing
      # without you needing to upload any signing secrets.
      - name: Build APK
        run: dotnet build HardwareShopMaui/HardwareShopMaui.csproj -c Debug -f net10.0-android --no-restore

      - name: Find the APK
        id: findapk
        run: |
          APK=$(find HardwareShopMaui/bin -name "*-Signed.apk" | head -n1)
          if [ -z "$APK" ]; then APK=$(find HardwareShopMaui/bin -name "*.apk" | head -n1); fi
          echo "Found APK: $APK"
          echo "apk_path=$APK" >> "$GITHUB_OUTPUT"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: hardware-shop-apk
          path: ${{ steps.findapk.outputs.apk_path }}
          if-no-files-found: error
